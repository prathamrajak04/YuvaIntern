# Inventory Manager - production settings.
# Relative paths are resolved against the install folder (the launcher scripts guarantee this).
# Use forward slashes, even on Windows (C:/inventory/data/inventory.csv), because a single
# backslash is an escape character in .properties files.

# Where the inventory is stored (CSV). Back up this single file to back up all data.
data.file=data/inventory.csv

# Application log (INFO and above). Rotate or archive it with your normal tooling.
log.file=logs/inventory.log

# "Low stock" report: items with quantity strictly below this number are listed.
low.stock.threshold=5

# Display only
app.name=Inventory Manager
app.version=1.0.0
